{% extends "emails/base_email.html" %}
{% block encabezado %}Recupera tu contraseña{% endblock %}
{% block contenido %}
<p>Hola {{ usuario.primer_nombre }},</p>
<p>Solicitaste restablecer tu contraseña. Sigue este enlace para continuar:</p>
<p><a href="{{ enlace }}">{{ enlace }}</a></p>
<p>Si no fuiste tú, ignora este correo.</p>
{% endblock %}
